  # Slide 13
  - kind: content
    part: 4
    number: 13
    eyebrow: "Parte 4 · IaC, cambio, costo y cierre · JR2"
    title: "La IaC cabe en 100 horas porque cubre un ambiente patrón y nada más"
    blocks:
      - {type: image, asset: architecture-iac, h: 236}
      - type: cards
        cols: 2
        items:
          - {icon: check-circle, title: "Cubre", text: "Terraform, el ambiente qa, ocho módulos de referencia (v0.4.0) y estado S3 con bloqueo"}
          - {icon: x-circle, title: "Deja fuera, a propósito", text: "Zona de aterrizaje, 200 fincas, 3 centros y entregables aparte"}
    source: "ADR-003 · Plan de 100 horas, sección 2 · complete/architecture-iac.svg"
    presenter: "JR2"
    time: "2:00"
    notes: |
      ¿Por qué el código de infraestructura cabe en 100 horas? Porque lo limitamos a lo que cuenta el caso: módulos, variables, estado remoto y un plan ejecutable de un ambiente.
      Usamos Terraform, porque las 28 reglas obligatorias del proyecto están escritas para él. Planeamos un ambiente patrón, qa. Las piezas reutilizables ya fusionadas son ocho módulos de referencia, publicados hasta la etiqueta v0.4.0: red, backend de estado, seguridad base, finca, ingesta de telemetría, funciones de inferencia, reglas de firewall y asociación del centro de acopio, con 142 ejecuciones de prueba en modo plan. El estado remoto es un bucket cifrado, versionado y con bloqueo nativo por ambiente.
      La configuración y los secretos están separados para dev, qa y pdn con tfvars de ejemplo; las credenciales entran por OIDC de GitHub Actions y las variables por TF_VAR, así que los secretos nunca quedan en el repositorio ni en el estado.
      El diagrama muestra las trece cajas, D01 a D13, una por tarea. Lo que dejamos fuera es igual de deliberado: la zona de aterrizaje está diseñada pero no codificada, no instanciamos las 200 fincas ni los tres centros, y las otras tres funciones y la consulta son solo arquitectura. Observabilidad, notas de versión, costos, sistema de diseño y esta defensa son entregables aparte, fuera de las 100 horas. El ADR-003 y la sección 2 del plan tienen el razonamiento.

