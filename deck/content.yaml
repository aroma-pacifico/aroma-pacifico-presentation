- kind: content
  title: Producción aplica solo el plan aprobado, y volver atrás pasa por la misma compuerta
  subtitle: CD con promoción dev, qa y pdn; rollback por revert y baja en orden inverso (anexos A24 y A25)
  presenter: JR2
  source: aroma-pacifico-architecture, automation-and-pipelines.md
  blocks:
  - type: steps
    h: 160
    items:
    - title: Merge a main
      text: Plan de dev y de qa en orden de stacks, con su costo
    - title: Revisión pdn
