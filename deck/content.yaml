      Este es el diagrama completo, en la carpeta complete del repositorio de diagramas. AWS es la nube principal, en una sola región, us-east-1; Azure queda preparada como destino de exportación, sin desplegar (ADR-001).
      Una organización tiene una cuenta de administración y cinco cuentas miembro: seguridad, red, producción, pruebas y desarrollo. En el borde están los nodos de finca, la estación de tierra del dron, las apps y las LAN de los centros.
      Las insignias D01 a D13 marcan lo que construye el código; JR2 vuelve a ellas en la parte 4.

  # Slide 4
  - kind: content
    part: 1
    number: 4
    eyebrow: "Parte 1 · Marco y base · SR1"
    title: "Gobierno desde la raíz e identidades separadas con mínimo privilegio"
    blocks:
      - type: cards
        cols: 2
        items:
          - {icon: shield-check, title: "Gobierno", text: "Políticas de control de servicios, política de etiquetas, presupuestos y trail de la organización; cinco etiquetas reparten el costo"}
          - {icon: eye, title: "Identidades", text: "Seis roles separados con mínimo privilegio; MFA para operadores de centro, de dron y de plataforma, y para el agrónomo"}
          - {icon: package, title: "Módulo de seguridad (B06, D06)", text: "Ocho llaves KMS con rotación, pool de Cognito con MFA TOTP para el personal y siete grupos de rol"}
          - {icon: x-circle, title: "Revocación inmediata", text: "Un dron perdido o un nodo retirado pierde su identidad y deja de publicar"}
      - type: callout
        h: 44
        tone: subtle
        text: "Datos cifrados con TLS en tránsito y llaves propias en reposo; retención de 5 años."
    source: "Zona de aterrizaje · Seguridad e identidad, sección 10 · aroma-pacifico-terraform-modules PR #12"
    presenter: "SR1"
    time: "0:35"
    notes: |
      La seguridad se aplica desde la raíz. Seis roles tienen identidades separadas con mínimo privilegio, y el MFA es obligatorio para operadores de centro, de dron y de plataforma, y para el agrónomo.
      El módulo de seguridad agrega ocho llaves KMS con rotación, un pool de Cognito con MFA TOTP y siete grupos de rol. Los datos se cifran en tránsito y en reposo y se guardan 5 años, y un dron o un nodo perdido pierde su identidad de inmediato.

  # Slide 5
  - kind: content
    part: 1
    number: 5
    eyebrow: "Parte 1 · Marco y base · SR1"
    title: "También se gobierna el cambio: reglas, revisión y decisiones registradas"
    blocks:
      - type: stats
        h: 104
        items:
          - {value: "7 SCP", label: "de servicio, aplicadas desde la raíz de la organización"}
          - {value: "8 claves", label: "en la política de etiquetas; 5 reparten el costo"}
          - {value: "28 reglas", label: "pc-iac vinculantes, comprobadas en la CI de cada PR"}
          - {value: "292", label: "entradas del registro: 185 ASM y 107 PD, más 4 ADR"}
      - type: cards
        cols: 2
        compact: true
        items:
          - {icon: scale, title: "Presupuestos y auditoría (A08)", text: "USD 650 en mes normal y USD 700 en cosecha, con alertas al 80 % y al 100 %; trail de la organización con 5 años de retención"}
          - {icon: check-circle, title: "Compuertas del cambio", text: "Trunk-based y Conventional Commits verificados en cada PR; revisa un agente de otro proveedor de IA"}
          - {icon: shield-check, title: "Solo plan", text: "Nadie ejecuta apply; producción cambiaría solo por el pipeline aprobado, como exige una SCP"}
          - {icon: package, title: "Decisiones con ID", text: "ADR-001 nube, ADR-002 modo de vuelo, ADR-003 IaC y ADR-004 orquestador del dron"}
    source: "Zona de aterrizaje, secciones 3, 5, 6 y 7 · standards/iac-rules · pr-conventions.yml · docs/decision-log.md"
    presenter: "SR1"
    time: "1:10"
    notes: |
      También gobernamos la plataforma y el cambio. Desde la raíz de la organización aplicamos siete políticas de control de servicios: no salir de la organización, solo us-east-1, proteger el trail, sin credenciales de larga duración, sin usuario raíz, etiquetas de costo obligatorias y cambios de producción solo por el pipeline.
      La política de etiquetas fija ocho claves, y cinco reparten el costo. Los presupuestos son de 650 dólares en mes normal y 700 en cosecha, con alertas al 80 y al 100 por ciento, y el trail de la organización guarda cinco años.
      En el código, las 28 reglas pc-iac son vinculantes y la CI comprueba en cada pull request las que se pueden verificar: formato, validación, lint, seguridad, pruebas, plan contra Floci e Infracost. Trabajamos trunk-based con Conventional Commits verificados, revisa un agente de otro proveedor de IA y nadie ejecuta apply: el proyecto termina en el plan.
      Cada supuesto tiene un ID: 185 supuestos, 107 decisiones pendientes y cuatro ADR. SR2 continúa con la conectividad.

  - kind: divider
    part: 2
    title: "Conectividad"
    presenter: "SR2"
    time: "3:45"
    agenda:
      - "Una regla para cada flujo"
      - "Sin señal"
      - "Centro de acopio y puerto"
      - "Firewall y lo que no compramos"
    notes: |
      Parte 2, a cargo de SR2: 3:45, diapositivas 6 a 9. Es el primero de los tres puntos que pide sustentar el caso.

  # Slide 6
  - kind: content
    part: 2
    number: 6
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Identidad, no dirección: más fincas suman identidades, no subredes"
    blocks:
      - {type: image, asset: connectivity, h: 214}
      - type: stats
        items:
          - {value: "X.509", label: "MQTT sobre TLS y QoS 1 al endpoint regional de IoT"}
          - {value: "Cada 4 h", label: "lectura de cultivo; secado cada hora con lote abierto"}
          - {value: "< 5 min", label: "alerta con ruta de entrega: meta de diseño (ASM-224)"}
          - {value: "10.80/13", label: "AWS, un /16 por ambiente; centros 10.41 a 10.43"}
    source: "Arquitectura, sección 12 · Plan de direccionamiento · network/connectivity.svg"
    presenter: "SR2"
    time: "1:00"
    notes: |
      La regla para cada flujo es identidad, no dirección. Fincas, teléfonos y drones no tienen dirección en la nube; se autentican con un certificado o un token, y por eso el patrón crece de 200 a 1.000 fincas sumando identidades, no subredes.
      El nodo de finca publica MQTT sobre TLS con un certificado X.509: cultivo cada 4 horas y secado cada hora con un lote abierto. La meta para la alerta con ruta de entrega es menos de 5 minutos; es una meta de diseño, no una medición.
      Los centros usan 10.41 a 10.43 y la nube la superred 10.80.0.0 barra 13, sin superposición.

  # Slide 7
  - kind: content
    part: 2
    number: 7
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Sin señal no se pierde nada: cada actor guarda y libera al confirmar"
    blocks:
      - {type: image, asset: no-signal, h: 222}
      - type: stats
        items:
          - {value: "24 h", label: "búfer cifrado del nodo; al volver, en vivo primero"}
          - {value: "Satélite", label: "el mismo nodo, sin radiobase nueva"}
          - {value: "7 días", label: "bandeja del transportador; la custodia no se pierde"}
          - {value: "Misión", label: "precargada; sin registro persistido no hay cierre"}
    source: "Arquitectura, sección 12 · supuestos ASM-073 a ASM-079 · network/no-signal-sequence.svg"
    presenter: "SR2"
    time: "1:00"
    notes: |
      Sin señal no se pierde nada. El nodo guarda un búfer cifrado de máximo 24 horas; al volver publica primero una lectura en vivo y luego vacía el búfer, y la alerta tardía queda marcada.
      Las fincas sin cobertura usan el mismo nodo con un portador satelital, sin radiobase nueva. La app del transportador guarda una bandeja cifrada, nunca descarta un evento de custodia y adelgaza posiciones antes de descartar alguna.
      La misión del dron se carga antes del despegue; si cae el enlace, el vuelo sigue y la fumigación no cierra sin el registro. La tabla completa está en la sección 12 de arquitectura.

  # Slide 8
  - kind: content
    part: 2
    number: 8
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Un patrón de LAN para tres centros; en el puerto, nada instalado"
    blocks:
      - {type: image, asset: collection-center, h: 222}
      - type: stats
        items:
          - {value: "7 zonas", label: "bloques /24; visitantes sin ruta interna"}
          - {value: "100 Mbps", label: "WAN, dos túneles IPsec y respaldo celular"}
          - {value: "90 Mbps", label: "planeados; el pico pide 68 (ASM-084)"}
          - {value: "Puerto", label: "sin equipos: solo el evento de entrega"}
    source: "Red del centro de acopio · Conectividad, sección 10 · network/collection-center.svg"
    presenter: "SR2"
    time: "0:55"
    notes: |
      En el centro de acopio, un solo patrón de LAN sirve a los tres departamentos con dos parámetros: la clave del centro y el segundo octeto. Siete zonas, cada una con su SSID, y la de visitantes no tiene ruta a logística ni a gerencia.
      La WAN es de 100 megabits, con dos túneles IPsec al Transit Gateway y respaldo celular. Con un supuesto de 50 por ciento de clientes activos en el pico, el centro necesita 68 megabits y planeamos 90.
      En Buenaventura no desplegamos nada: la plataforma registra solo el evento de entrega desde la app del transportador.

  # Slide 9
  - kind: content
    part: 2
    number: 9
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Firewall en cada centro y en la nube, sin NAT ni appliance de red"
    blocks:
      - type: split
        ratio: 0.56
        left:
          - {type: image, asset: firewall}
        right:
          - type: bullets
            items:
              - "**Tablas de política** con origen, destino, puerto, acción y vigencia: permanente o temporal"
              - "**Servicios de AWS por endpoints:** sin NAT gateway ni Network Firewall"
              - "**La capa de datos** no tiene ruta a internet y ningún centro llega a ella"
              - "**Ahorro neto:** USD 10.856,40 al año (ASM-127)"
    source: "Política de firewall · Arquitectura, secciones 5 y 15 · Costos del piloto, sección 9 · security/firewall-policy.svg"
    presenter: "SR2"
    time: "0:50"
    notes: |
      Cada centro tiene un firewall perimetral y la nube el suyo, con tablas de política que dicen origen, destino, puerto, acción y vigencia. La capa de datos no tiene ruta a internet y ningún centro la alcanza.
      No compramos NAT gateway ni appliance de firewall: llegamos a AWS por endpoints, y según el documento de costos eso ahorra 10.856 dólares netos al año.
      La misma lógica de una misión que espera su enlace nos lleva a los drones. Continúa JR1.

  - kind: divider
    part: 3
    title: "Modo de vuelo y cargas de trabajo"
    presenter: "JR1"
    time: "3:15"
    agenda:
      - "Modo de vuelo combinado"
      - "De la alerta al caso cerrado"
      - "Inferencia por eventos"
      - "Observabilidad y los dos SLO"
    notes: |
      Parte 3, a cargo de JR1: 3:15, diapositivas 10 a 13. Es el segundo punto que pide sustentar el caso: el modo de vuelo.

  # Slide 10
  - kind: content
    part: 3
    number: 10
    eyebrow: "Parte 3 · Modo de vuelo y cargas · JR1"
    title: "Solo el modo combinado cubre los cinco servicios obligatorios del dron"
    blocks:
      - type: cards
        cols: 3
        items:
          - {icon: location, title: "Área", text: "Delimitar el lote y estimar la cosecha. Es el estado normal de cada finca: un vuelo de estimación por cosecha"}
          - {icon: eye, title: "Precisión", text: "Confirmar la alerta, fumigar el foco y verificar el mismo lote. Solo se entra con una alerta de cultivo"}
          - {icon: alert-triangle, title: "Cambio de modo", text: "crop_alert_raised y luego focus_confirmed. Solo un foco confirmado puede llevar a una orden de fumigación"}
      - type: callout
        h: 64
        text: "Vuela un operador certificado contratado. Un agrónomo de la Federación autoriza cada fumigación como identidad humana con MFA (ADR-002)."
    source: "ADR-002, modo de vuelo y gobierno del dron"
    presenter: "JR1"
    time: "1:00"
    notes: |
      El modo de vuelo es combinado. El caso tiene cinco servicios obligatorios y ninguno reemplaza a otro: el modo área delimita el lote y estima la cosecha; el modo precisión confirma la alerta, fumiga el foco y verifica el mismo lote. Solo el combinado cubre los cinco.
      El cambio de modo es un par de eventos persistidos, crop alert raised y luego focus confirmed, y solo un foco confirmado lleva a una orden de fumigación.
      Vuela un operador certificado contratado y un agrónomo de la Federación autoriza cada fumigación con MFA: es el ADR-002.

  # Slide 11
  - kind: content
    part: 3
    number: 11
    eyebrow: "Parte 3 · Modo de vuelo y cargas · JR1"
    title: "Cuatro compuertas impiden fumigar sin evidencia ni autorización humana"
    blocks:
      - {type: image, asset: fumigation-flow-1, h: 78}
      - {type: image, asset: fumigation-flow-2, h: 78}
      - type: cards
        cols: 4
        compact: true
        items:
          - {icon: x-circle, title: "La orden no sale", text: "Sin polígono del lote o sin registro de vuelo cerrado"}
          - {icon: clock, title: "Fumigación abierta", text: "Hasta persistir el objeto de verificación"}
          - {icon: shield-check, title: "Autorización humana", text: "Ningún disparador la ejecuta"}
          - {icon: location, title: "Cae el enlace", text: "La misión ya está cargada; el registro se publica al volver"}
    source: "Servicio de drones · complete/architecture.svg, flujo de plaga a fumigación"
    presenter: "JR1"
    time: "0:50"
    notes: |
      Este es el camino de la alerta al caso cerrado, en ocho pasos persistidos, con cuatro compuertas.
      La orden no sale sin el polígono del lote y un registro de vuelo cerrado. La fumigación sigue abierta hasta que llega el objeto de verificación. La autorización es humana y ningún disparador la ejecuta.
      Y si cae el enlace, la misión ya está cargada y el registro se publica al volver; el estado no cambia hasta persistirlo.

