        items:
          - {value: "200", label: "fincas en Cauca, Huila y Tolima"}
          - {value: "3", label: "centros de acopio"}
          - {value: "60", label: "transportadores"}
          - {value: "1", label: "puerto de entrega: Buenaventura"}
      - type: callout
        h: 64
        text: "Entrega solo de plan: diseño, Terraform modular, costos y esta sustentación. Nada se aplica ni se despliega; el plan corre contra el emulador Floci y la CI incluye Infracost."
      - type: cards
        cols: 3
        items:
          - {icon: location, title: "Conectividad", text: "Cada flujo con búfer y conducta sin señal"}
          - {icon: eye, title: "Modo de vuelo", text: "Combinado, con autorización humana"}
          - {icon: clock, title: "IaC en 100 horas", text: "Un ambiente patrón y su plan ejecutable"}
    source: "Enunciado del caso, «Contexto» y «Cifras del piloto» · Arquitectura, secciones 1 y 16"
    presenter: "SR1"
    time: "0:35"
    notes: |
      Buenos días. Presentamos la actualización 2026 del piloto de trazabilidad de café de Aroma Pacífico: 200 fincas en Cauca, Huila y Tolima, tres centros de acopio, 60 transportadores y la entrega en Buenaventura.
      La entrega es solo de plan: diseño, Terraform reutilizable, costos y esta sustentación. Nada se aplica ni se despliega; el plan corre contra el emulador Floci y la CI estima el costo con Infracost.
      Sustentamos la conectividad, el modo de vuelo y por qué la IaC cabe en 100 horas, con énfasis en gobierno, plan, código y costos.

  # Slide 2
  - kind: content
    part: 1
    number: 2
    eyebrow: "Parte 1 · Marco y base · SR1"
    title: "El supuesto de 2020 ya no sirve: cada flujo funciona sin señal"
    blocks:
      - type: compare
        headers: ["Supuesto de 2020", "Diseño 2026"]
        rows:
          - ["Cobertura de datos en la mayoría de las fincas; el equipo publica directo", "Protocolo de salida, búfer local de máximo 24 horas y conducta definida sin señal"]
          - ["Centro de acopio y puerto sin LAN ni WAN", "LAN segmentada por centro y WAN de 100 Mbps; ningún equipo en el puerto"]
          - ["Una generación móvil que los operadores pueden apagar", "Portador LTE y portador IP satelital para las fincas sin cobertura"]
          - ["Precios y servicios de 2020", "No son cotización válida: el documento de costos es nuevo (A23)"]
    source: "Arquitectura, secciones 5, 12 y 13 · Conectividad"
    presenter: "SR1"
    time: "0:50"
    notes: |
      El diseño de 2020 suponía cobertura de datos en la mayoría de las fincas y un equipo que publicaba directo; el centro de acopio y el puerto no tenían red.
      Ahora cada flujo tiene un protocolo de salida, un búfer local de máximo 24 horas y una conducta definida sin señal. Cada centro recibe una LAN segmentada y una WAN de 100 megabits, el puerto no recibe equipos y no dependemos de una generación móvil que se apague.
      Los precios de 2020 no son cotización válida, así que los costos son nuevos. El detalle está en la sección 13 del documento de arquitectura.

