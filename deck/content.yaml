# Slide content of the proposal deck. build_deck.py reads this file.
# Visible text and speaker notes are in Spanish because the defense is in
# Spanish; keys, comments and file names stay in English.
# The deck is a proposal that shows the designed solution in full. Every
# figure comes from a merged document of aroma-pacifico-architecture,
# aroma-pacifico-infrastructure, aroma-pacifico-terraform-modules or
# aroma-pacifico-design-system; the `source` of each slide names it and is
# written into the speaker notes, not onto the slide.
# Who presents a slide (`presenter`) appears only in the speaker notes and in
# docs/guion-sustentacion.md. The target time of a slide is derived from its
# notes at 130 words per minute, so it follows the text.

# Frame of docs/guion-sustentacion.md. The slide-by-slide text is the
# `notes` of each slide, so the script and the PPTX notes always match.
script:
  status: Guion de ensayo. El tiempo de cada diapositiva es su texto leído a 130 palabras por minuto; el ensayo completo lo confirma.
  issue: aroma-pacifico/aroma-pacifico-roadmap#38 (A25)
  target: 18 a 20 minutos
  intro: 'El guion está escrito para decirse en voz alta, en frases cortas, a unas 130 palabras por minuto. Cada presentador adapta la redacción; las cifras y las referencias son la parte fija. Toda cifra es del enunciado del caso, aritmética sobre una de ellas o una meta de diseño: se dice «meta de diseño» y nunca «medido». La fuente de cada diapositiva queda al final de su texto y en las notas del orador, no en la diapositiva.


    En la portada, Esteban lee el título y pasa a la diapositiva del equipo, donde cada presentador dice su nombre y su rol en el orden de la exposición. Las diapositivas de diagrama completo duran poco: el presentador señala tres zonas y sigue; el detalle queda en el anexo para las preguntas.

    '
  annex: 'Después del cierre viene una sola diapositiva de anexo, que no se expone: la lista de los 25 diagramas, cada uno con su código (A01 a A25, los que citan las notas) y un enlace que lo abre en el visor del sitio del proyecto, con zoom. Ante una pregunta, se hace clic en el diagrama; al terminar las preguntas se retrocede una diapositiva, al cierre con el código QR. Las preguntas probables y sus respuestas están en [defense-qa.md](defense-qa.md).'
