  presenter: SR1
  notes: 'La nube principal es AWS, en una sola región, us-east-1. Los criterios: que funciones, almacenamiento e inferencia administrada vivan en la misma región, para decir a qué país y a qué región salen los objetos; que las 28 reglas IaC del equipo ya estén escritas para AWS; y no duplicar la plataforma.

    sa-east-1 no permite nombrar la región de la inferencia de visión, y Azure o GCP como principal exigiría reescribir las reglas dentro de las 100 horas. Azure queda preparada con tres propiedades: interfaces neutrales, datos en formato abierto y un destino de exportación declarado, sin desplegar nada.

    '
