slides:
- kind: cover
  eyebrow: Propuesta técnica · Reto DevOps 2026
  title: Trazabilidad del café de la finca al puerto, lista para operar
  subtitle: Piloto 2026 en Cauca, Huila y Tolima, sobre AWS
  date: Noviembre de 2026
  presenter: SR1
  notes: 'Buenos días. Somos el equipo que propone diseñar, codificar y entregar la actualización 2026 del piloto de trazabilidad de café de Aroma Pacífico.

    '
- kind: team
  institution: Universidad Icesi
  title: El equipo
  presenter: SR1
  notes: 'Cada integrante dice su nombre, su rol y la parte que presenta: Esteban Gaviria Zambrano, Senior DevOps, el caso, la arquitectura y el gobierno, y al final los costos; Karen Valeria Jurado Calpa, Junior DevOps, red, conectividad y seguridad; Jeanpaul Atkinson Vidales Gallego, Senior DevOps, las cargas: finca, drones, inferencia, saco y observabilidad; César Augusto Jiménez Reina, Junior DevOps, la infraestructura como código y el plan de 100 horas.

    '
- kind: content
  title: 200 fincas sin señal confiable necesitan una trazabilidad que no dependa de ella
  subtitle: La Federación retoma en 2026 el piloto que no se desplegó en 2020
  blocks:
  - type: stats
    h: 116
    items:
    - value: '200'
      label: fincas en Cauca, Huila y Tolima
    - value: '3'
      label: centros de acopio, uno por departamento
    - value: '60'
      label: transportadores con posición cada 5 minutos
    - value: '1'
      label: 'puerto de entrega: Buenaventura'
  - type: compare
    headers:
    - Lo que suponía 2020
    - Lo que exige 2026
    rows:
    - - Cobertura de datos en la mayoría de las fincas
      - Cada flujo con protocolo, búfer local de 24 horas y conducta sin señal
    - - Centro de acopio y puerto sin LAN ni WAN
      - LAN segmentada y WAN de 100 Mbps en cada centro; nada instalado en el puerto
    - - Precios, equipos y nube de 2020
      - Costos a precios de ahora y una nube elegida y justificada
  source: Enunciado del caso, «Contexto», «Qué se actualiza» y «Cifras del piloto»
  presenter: SR1
  notes: 'El piloto de 2020 rastreaba el café desde la finca hasta el comprador, pero nunca se desplegó, y su supuesto central ya no se cumple: suponía señal en la mayoría de las fincas.

    En 2026 son 200 fincas en tres departamentos, tres centros de acopio, 60 transportadores y la entrega en Buenaventura. Nuestra propuesta parte de un principio: cada flujo funciona aunque no haya señal.

    '
- kind: content
  title: Nos comprometemos con metas medibles, no con promesas
  subtitle: Cada meta tiene un indicador, un umbral y un documento que la sostiene
  blocks:
  - type: stats
    cols: 4
    items:
    - value: 95 %
      label: de las alertas recibidas por el caficultor en 300 s (SLO 1, 28 días)
    - value: 99,5 %
      label: de las consultas del saco sin error 5XX ni 429 (SLO 2, 28 días)
    - value: < 5 min
      label: de la lectura fuera de rango a la alerta, con ruta disponible
    - value: 24 h
      label: de búfer local como máximo cuando no hay señal
    - value: 5 años
      label: de retención de lecturas, fotos, vuelos y saco
    - value: 15 min / 4 h
      label: RPO de los eventos del saco y RTO de la consulta pública
    - value: 98 de 100 h
      label: de IaC en 2 semanas, con 2 h de reserva
    - value: USD 2.707
      label: al mes en operación normal; USD 10.639 en cosecha
  source: Observabilidad, ASM-224 y ASM-225 · Enunciado del caso · Plan de 100 horas · Costos del piloto, sección 1
  presenter: SR1
  notes: 'Estas son las metas con las que nos comprometemos. Dos SLO: el 95 por ciento de las alertas llega al caficultor en 300 segundos y el 99,5 por ciento de las consultas del saco responde sin error, ambos en 28 días móviles.

    Del caso vienen la alerta en menos de 5 minutos, el búfer de 24 horas, la retención de 5 años, el RPO de 15 minutos y el RTO de 4 horas. La IaC ocupa 98 de las 100 horas y el piloto cuesta 2.707 dólares en un mes normal y 10.639 en cosecha. Todas son metas de diseño, con su indicador definido.

    '
- kind: content
  title: Las reglas de operación del cliente definen el diseño
  subtitle: Restricciones no técnicas y técnicas del caso que la propuesta respeta
  blocks:
  - type: cards
    cols: 4
    compact: true
    items:
    - icon: location
      title: Una sola visita
      text: La instalación en finca se hace en una visita y con poco equipo
    - icon: scale
      title: Poca inversión
      text: Hardware por finca y cuota mensual moderados
    - icon: eye
      title: Pocas pantallas
      text: App del caficultor sencilla para quien desconfía de dejar el cuaderno
    - icon: shield-check
      title: Dron gobernado
      text: Se define quién vuela, quién autoriza y con qué permiso
    - icon: sun
      title: Finca autónoma
      text: Nodo solar que soporta humedad y temperatura altas
    - icon: package
      title: Escala a 1.000
      text: Red e ingesta crecen de 200 a 1.000 fincas sin redireccionar
    - icon: clock
      title: Ventana de cosecha
      text: Ningún cambio productivo de 05:00 a 18:00 en semana de cosecha
    - icon: calendar
      title: IaC acotada
      text: Módulos, variables, estado y plan de un ambiente en 100 horas
  source: Enunciado del caso, «Restricciones», «Automatización y cambio» y «Épica 6»
  presenter: SR1
  notes: 'El cliente fija reglas que no negociamos: una sola visita a la finca, poca inversión del caficultor, una app de pocas pantallas y un dron gobernado. En lo técnico: un nodo autónomo en energía, un patrón que escala a 1.000 fincas sin redireccionar, ningún cambio productivo en el día de una semana de cosecha y una IaC acotada a 100 horas. Cada decisión que sigue responde a una de estas reglas.

    '
- kind: content
  title: De 2020 conservamos ocho requisitos y reemplazamos lo que dejó de ser cierto
  subtitle: Dieciocho elementos del piloto de 2020, cada uno con su destino y su razón
  blocks:
  - type: stats
    h: 116
    items:
    - value: '8'
      label: 'requisitos que se conservan: del saco de 60 kg a la consulta por código'
    - value: '4'
      label: 'supuestos que se reemplazan: cobertura, publicación directa, centro y puerto sin red'
    - value: '6'
      label: 'elementos que se retiran: precios, equipos, nube y manual de 2020'
  - type: cards
    cols: 2
    compact: true
    items:
    - icon: check-circle
      title: Se conserva
      text: Trazabilidad de la finca al comprador, mismo territorio, cinco servicios de dron y tres aplicaciones
    - icon: alert-triangle
      title: Se reemplaza
      text: Señal en la finca por búfer de 24 h y portador satelital; centro sin red por LAN de siete zonas
  source: Arquitectura, sección 13 · legacy-2020.md · legacy/legacy-2020.svg
  presenter: SR1
  notes: 'No copiamos la arquitectura de 2020, como pide el caso. De 18 elementos, conservamos 8 requisitos que siguen vigentes, reemplazamos 4 supuestos de conectividad que ya no se cumplen y retiramos 6 elementos, como los precios y el manual de 2020. La trazabilidad de cada uno está en el anexo A04.

    '
- kind: content
  title: Dimensionamos con las cifras del caso, de hoy y a cinco años
  subtitle: Volúmenes de diseño por flujo; el patrón soporta cinco veces las fincas sin cambiar
  blocks:
  - type: table
