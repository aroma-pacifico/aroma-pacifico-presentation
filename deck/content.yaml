      Preguntas probables y quién responde primero:
      - ¿Por qué AWS y qué significa la segunda nube preparada? SR1. Una región con almacenamiento, funciones e inferencia administrada; Azure solo como destino de exportación abierto, sin despliegue (ADR-001).
      - ¿Qué pasa con una finca sin señal más de 24 horas? SR2. El búfer guarda máximo 24 horas; lo más antiguo se descarta, se cuenta y se reporta como hueco, y el nodo silencioso levanta una detección.
      - ¿Cómo saben que la alerta llega en menos de 5 minutos? JR1. No lo afirmamos como medición: es una meta con SLI definido, 95 por ciento en 28 días (ASM-224).
      - ¿Corrieron un plan? JR2. El plan corre contra el emulador Floci en la CI, con Infracost; con la asociación del centro, el stack de red propone 163 recursos en qa. La validación final B13 está pendiente. Nada se aplicó.
