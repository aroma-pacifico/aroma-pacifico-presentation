      Parte 1, a cargo de SR1: 4 minutos, diapositivas 1 a 4. Sin tiempo propio; pasar de inmediato a la diapositiva 1.

  # Slide 1
  - kind: content
    part: 1
    number: 1
    eyebrow: "Parte 1 · Marco y base · SR1"
    title: "Actualizamos el piloto de 2020 para 200 fincas, sin desplegar nada"
    blocks:
      - type: stats
        h: 120
        items:
          - {value: "200", label: "fincas en Cauca, Huila y Tolima"}
          - {value: "3", label: "centros de acopio"}
          - {value: "60", label: "transportadores"}
          - {value: "1", label: "puerto de entrega: Buenaventura"}
      - type: callout
        h: 64
        text: "Entrega solo de plan: diseño, Terraform modular, costos y esta sustentación. Nada se aplica ni se despliega; el plan corre contra el emulador Floci y la CI incluye Infracost."
      - type: cards
        cols: 3
        items:
          - {icon: location, title: "Conectividad", text: "Cada flujo con búfer y conducta sin señal"}
          - {icon: eye, title: "Modo de vuelo", text: "Combinado, con autorización humana"}
          - {icon: clock, title: "IaC en 100 horas", text: "Un ambiente patrón y su plan ejecutable"}
    source: "Enunciado del caso, «Contexto» y «Cifras del piloto» · Arquitectura, secciones 1 y 16"
    presenter: "SR1"
    time: "0:45"
    notes: |
      Buenos días. Presentamos la actualización 2026 del piloto de trazabilidad de café de Aroma Pacífico: 200 fincas en Cauca, Huila y Tolima, tres centros de acopio, 60 transportadores y la entrega en el puerto de Buenaventura.
      La entrega es solo de plan: diseño, Terraform reutilizable, costos y esta sustentación. No aplicamos ni desplegamos nada. El plan se ejecuta contra el emulador Floci y la integración continua estima el costo con Infracost.
      Somos cuatro presentadores. Vamos a sustentar tres cosas: la conectividad, el modo de vuelo de los drones y por qué el código de infraestructura cabe en 100 horas. Todo lo que decimos está escrito en el documento de arquitectura, y nombramos la sección a medida que avanzamos.

  # Slide 2
  - kind: content
    part: 1
    number: 2
    eyebrow: "Parte 1 · Marco y base · SR1"
    title: "El supuesto de 2020 ya no sirve: cada flujo funciona sin señal"
    blocks:
      - type: compare
        headers: ["Supuesto de 2020", "Diseño 2026"]
        rows:
          - ["Cobertura de datos en la mayoría de las fincas; el equipo publica directo", "Protocolo de salida, búfer local de máximo 24 horas y conducta definida sin señal"]
          - ["Centro de acopio y puerto sin LAN ni WAN", "LAN segmentada por centro y WAN de 100 Mbps; ningún equipo en el puerto"]
          - ["Una generación móvil que los operadores pueden apagar", "Portador LTE y portador IP satelital para las fincas sin cobertura"]
          - ["Precios y servicios de 2020", "No son cotización válida: el documento de costos es nuevo (A23)"]
    source: "Arquitectura, secciones 5, 12 y 13 · Conectividad"
    presenter: "SR1"
    time: "1:15"
    notes: |
      El diseño de 2020 suponía cobertura de datos en la mayoría de las fincas y un equipo que publicaba directo al punto de ingesta. El centro de acopio y el puerto no tenían red.
      Conservamos los requisitos que siguen vigentes y reemplazamos el supuesto de conectividad. Ahora cada flujo tiene un protocolo de salida, un búfer local de máximo 24 horas y una conducta definida cuando no hay señal.
      Cada centro recibe una LAN segmentada y una WAN de 100 megabits. El puerto no recibe equipos de la Federación. Y la solución no depende de una generación móvil que los operadores apaguen.
      Los precios, equipos y servicios de 2020 no son una cotización válida, así que los costos son nuevos. Lo que se conserva y lo que se retira está en la sección 13 del documento de arquitectura.

  # Slide 3
  - kind: content
    part: 1
    number: 3
    eyebrow: "Parte 1 · Marco y base · SR1"
    title: "Una nube, una región y cinco cuentas; la IaC, marcada de D01 a D13"
    blocks:
      - type: split
        ratio: 0.7
        left:
          - type: image
            asset: architecture
            labels:
              - {text: "1 Fincas", x: 0.12, y: 0.035}
              - {text: "2 Centros de acopio", x: 0.38, y: 0.035}
              - {text: "3 Drones", x: 0.62, y: 0.035}
              - {text: "4 Transporte y puerto", x: 0.885, y: 0.035}
              - {text: "5 Organización AWS e IaC", x: 0.15, y: 0.378}
              - {text: "6 Producción, us-east-1", x: 0.53, y: 0.418}
        right:
          - type: cards
            cols: 1
            compact: true
            items:
              - {icon: shield-check, title: "Nube", text: "AWS en us-east-1; Azure preparada, sin desplegar (ADR-001)"}
              - {icon: package, title: "Cuentas", text: "Una organización y cinco cuentas miembro"}
              - {icon: location, title: "Borde", text: "Dos nodos solares por finca, estación de tierra, apps y LAN por centro"}
              - {icon: check-circle, title: "Cajas D01 a D13", text: "Lo que construye el código de infraestructura"}
    source: "aroma-pacifico-diagrams, complete/architecture.svg (recorte de la vista de ejecución)"
    presenter: "SR1"
    time: "1:15"
    notes: |
      Este es el diagrama completo, en el repositorio de diagramas, carpeta complete. AWS es la nube principal, en una sola región, us-east-1. Azure está preparada como destino de exportación no desplegado, para el historial en formato abierto y los objetos del dron; así no duplicamos la plataforma.
      Una organización tiene una cuenta de administración y cinco cuentas miembro: seguridad, red, producción, pruebas y desarrollo.
      En el borde ven los nodos de finca, la estación de tierra del dron, las apps y las LAN de los centros. Las insignias numeradas D01 a D13 marcan lo que construye el código de infraestructura; JR2 vuelve a ellas en la parte 4.

  # Slide 4
  - kind: content
    part: 1
    number: 4
    eyebrow: "Parte 1 · Marco y base · SR1"
    title: "Gobierno desde la raíz e identidades separadas con mínimo privilegio"
    blocks:
      - type: cards
        cols: 2
        items:
          - {icon: shield-check, title: "Gobierno", text: "Políticas de control de servicios, política de etiquetas, presupuestos y trail de la organización; cinco etiquetas reparten el costo"}
          - {icon: eye, title: "Identidades", text: "Seis roles separados con mínimo privilegio; MFA para operadores de centro, de dron y de plataforma, y para el agrónomo"}
          - {icon: package, title: "Módulo de seguridad (B06, D06)", text: "Ocho llaves KMS con rotación, pool de Cognito con MFA TOTP para el personal y siete grupos de rol"}
          - {icon: x-circle, title: "Revocación inmediata", text: "Un dron perdido o un nodo retirado pierde su identidad y deja de publicar"}
      - type: callout
        h: 44
        tone: subtle
        text: "Datos cifrados con TLS en tránsito y llaves propias en reposo; retención de 5 años."
    source: "Zona de aterrizaje · Seguridad e identidad, sección 10 · aroma-pacifico-terraform-modules PR #12"
    presenter: "SR1"
    time: "0:45"
    notes: |
      El gobierno y la seguridad se aplican desde la raíz: políticas de control de servicios, una política de etiquetas, presupuestos y un trail de la organización. Las etiquetas reparten el costo por fincas, drones, centros, viajes y ambientes.
      Seis roles tienen identidades separadas con mínimo privilegio. El módulo de seguridad base agrega ocho llaves administradas por el cliente con rotación, un pool de Cognito para el personal con MFA TOTP, un pool de campo sin contraseña, siete grupos de rol y un rol de revocación.
      El MFA es obligatorio para el operador del centro, el operador del dron, el operador de plataforma y el agrónomo. Los datos se cifran en tránsito y en reposo y se guardan 5 años. El comprador ve solo origen, fechas de proceso, estado y variables de secado.
      Si se pierde un nodo o un dron, su identidad se revoca de inmediato y deja de publicar. SR2 continúa con la conectividad.

  - kind: divider
    part: 2
    title: "Conectividad"
    presenter: "SR2"
    time: "5:00"
    agenda:
      - "Una regla para cada flujo"
      - "Sin señal"
      - "Centro de acopio y puerto"
      - "Firewall y lo que no compramos"
    notes: |
      Parte 2, a cargo de SR2: 5 minutos, diapositivas 5 a 8. Es el primero de los tres puntos que pide sustentar el caso.

  # Slide 5
  - kind: content
    part: 2
    number: 5
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Identidad, no dirección: más fincas suman identidades, no subredes"
    blocks:
      - {type: image, asset: connectivity, h: 214}
      - type: stats
        items:
          - {value: "X.509", label: "MQTT sobre TLS y QoS 1 al endpoint regional de IoT"}
          - {value: "Cada 4 h", label: "lectura de cultivo; secado cada hora con lote abierto"}
          - {value: "< 5 min", label: "alerta con ruta de entrega: meta de diseño (ASM-224)"}
          - {value: "10.80/13", label: "AWS, un /16 por ambiente; centros 10.41 a 10.43"}
    source: "Arquitectura, sección 12 · Plan de direccionamiento · network/connectivity.svg"
    presenter: "SR2"
    time: "1:30"
    notes: |
      La regla para cada flujo es identidad, no dirección. Las fincas, los teléfonos y los drones no tienen dirección en la nube. Se autentican con un certificado o un token. Por eso el patrón crece de 200 a 1.000 fincas sumando identidades, no subredes.
      Un nodo de finca publica MQTT sobre TLS con un certificado X.509 al endpoint regional de IoT. Las lecturas de cultivo van cada 4 horas; las de secado, cada hora mientras hay un lote abierto.
      Con ruta de entrega, la meta para la alerta es menos de 5 minutos desde la lectura fuera de rango. Es una meta de diseño, no una medición.
      Las redes de los centros son 10.41, 10.42 y 10.43. La nube usa una superred aparte, 10.80.0.0 barra 13, con un barra 16 por ambiente, así que nada se superpone.

  # Slide 6
  - kind: content
    part: 2
    number: 6
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Sin señal no se pierde nada: cada actor guarda y libera al confirmar"
    blocks:
      - {type: image, asset: no-signal, h: 222}
      - type: stats
        items:
          - {value: "24 h", label: "búfer cifrado del nodo; al volver, en vivo primero"}
          - {value: "Satélite", label: "el mismo nodo, sin radiobase nueva"}
          - {value: "7 días", label: "bandeja del transportador; la custodia no se pierde"}
          - {value: "Misión", label: "precargada; sin registro persistido no hay cierre"}
    source: "Arquitectura, sección 12 · supuestos ASM-073 a ASM-079 · network/no-signal-sequence.svg"
    presenter: "SR2"
    time: "1:30"
    notes: |
      Ahora el caso que importa: sin señal. El nodo de finca guarda un búfer cifrado de máximo 24 horas. Al reconectarse publica primero una lectura en vivo y luego vacía el búfer empezando por la más antigua. La alerta se levanta en ese vaciado, dentro de las 24 horas, y queda marcada como retrasada.
      Para las fincas fuera de cobertura usamos el mismo nodo con un portador IP satelital. Eso significa ninguna radiobase nueva y ninguna visita semanal.
      La app del transportador guarda una bandeja de salida cifrada. Registra una posición cada 5 minutos, nunca descarta un evento de custodia y adelgaza las posiciones antes de descartar alguna.
      La misión del dron se carga antes del despegue, en la cabecera municipal o en el centro de acopio. Si cae el enlace, el vuelo sigue, el registro espera en el búfer y la fumigación no puede cerrarse sin él. La tabla completa está en la sección 12 del documento de arquitectura.

  # Slide 7
  - kind: content
    part: 2
    number: 7
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Un patrón de LAN para tres centros; en el puerto, nada instalado"
    blocks:
      - {type: image, asset: collection-center, h: 222}
      - type: stats
        items:
          - {value: "7 zonas", label: "bloques /24; visitantes sin ruta interna"}
          - {value: "100 Mbps", label: "WAN, dos túneles IPsec y respaldo celular"}
          - {value: "90 Mbps", label: "planeados; el pico pide 68 (ASM-084)"}
          - {value: "Puerto", label: "sin equipos: solo el evento de entrega"}
    source: "Red del centro de acopio · Conectividad, sección 10 · network/collection-center.svg"
    presenter: "SR2"
    time: "1:00"
    notes: |
      En el centro de acopio, un solo patrón de LAN sirve a los tres departamentos con dos parámetros: la clave del centro y el segundo octeto. Siete zonas conservan los bloques reservados, cada una con su SSID, y la zona de visitantes no tiene ruta a logística ni a gerencia.
      La WAN es de 100 megabits, con dos túneles IPsec a un Transit Gateway y un respaldo celular. Como aritmética sobre un supuesto de 50 por ciento de clientes activos en el pico de cosecha, el centro necesita 68 megabits de bajada y 17 de subida, y planeamos 90.
      En el puerto de Buenaventura no desplegamos nada. La naviera conserva su telemetría y la plataforma registra solo el evento de entrega, que envía la app del transportador.

  # Slide 8
  - kind: content
    part: 2
    number: 8
    eyebrow: "Parte 2 · Conectividad · SR2"
    title: "Firewall en cada centro y en la nube, sin NAT ni appliance de red"
    blocks:
      - type: split
        ratio: 0.56
        left:
          - {type: image, asset: firewall}
        right:
          - type: bullets
            items:
              - "**Tablas de política** con origen, destino, puerto, acción y vigencia: permanente o temporal"
              - "**Servicios de AWS por endpoints:** sin NAT gateway ni Network Firewall"
              - "**La capa de datos** no tiene ruta a internet y ningún centro llega a ella"
              - "**Ahorro neto:** USD 10.856,40 al año (ASM-127)"
    source: "Política de firewall · Arquitectura, secciones 5 y 15 · Costos del piloto, sección 9 · security/firewall-policy.svg"
    presenter: "SR2"
    time: "1:00"
    notes: |
      Cada centro tiene un firewall perimetral y la nube tiene el suyo. Las tablas de política listan origen, destino, puerto, acción y si la regla se queda en el piloto o es temporal.
      La capa de datos no tiene ruta a internet y ningún centro puede alcanzarla. También decidimos no comprar un NAT gateway ni un appliance de firewall de red: llegamos a los servicios de AWS por endpoints. Según el documento de costos, eso ahorra 10.856 dólares netos al año.
      La misma lógica de una misión que espera su enlace nos lleva a los drones. Continúa JR1.

  - kind: divider
    part: 3
    title: "Modo de vuelo y cargas de trabajo"
    presenter: "JR1"
    time: "5:00"
    agenda:
      - "Modo de vuelo combinado"
      - "De la alerta al caso cerrado"
      - "Inferencia por eventos"
      - "Observabilidad y los dos SLO"
    notes: |
      Parte 3, a cargo de JR1: 5 minutos, diapositivas 9 a 12. Es el segundo punto que pide sustentar el caso: el modo de vuelo.

  # Slide 9
  - kind: content
    part: 3
    number: 9
    eyebrow: "Parte 3 · Modo de vuelo y cargas · JR1"
    title: "Solo el modo combinado cubre los cinco servicios obligatorios del dron"
    blocks:
      - type: cards
        cols: 3
        items:
          - {icon: location, title: "Área", text: "Delimitar el lote y estimar la cosecha. Es el estado normal de cada finca: un vuelo de estimación por cosecha"}
          - {icon: eye, title: "Precisión", text: "Confirmar la alerta, fumigar el foco y verificar el mismo lote. Solo se entra con una alerta de cultivo"}
          - {icon: alert-triangle, title: "Cambio de modo", text: "crop_alert_raised y luego focus_confirmed. Solo un foco confirmado puede llevar a una orden de fumigación"}
      - type: callout
        h: 64
        text: "Vuela un operador certificado contratado. Un agrónomo de la Federación autoriza cada fumigación como identidad humana con MFA (ADR-002)."
    source: "ADR-002, modo de vuelo y gobierno del dron"
    presenter: "JR1"
    time: "1:30"
    notes: |
      El modo de vuelo es combinado. El enunciado del caso tiene cinco servicios obligatorios y ninguno reemplaza a otro. El modo área delimita el lote y estima la cosecha. El modo precisión confirma la alerta, fumiga el foco y verifica el mismo lote. Solo el modo combinado cubre los cinco.
      El cambio entre modos es un par de eventos persistidos: crop alert raised y luego focus confirmed. Por defecto una finca está en modo área, y solo un foco confirmado puede llevar a una orden de fumigación.
      Vuela un operador certificado contratado. Un agrónomo de la Federación autoriza cada fumigación como identidad humana con MFA. Esto es el ADR-002.

  # Slide 10
  - kind: content
    part: 3
    number: 10
    eyebrow: "Parte 3 · Modo de vuelo y cargas · JR1"
    title: "Cuatro compuertas impiden fumigar sin evidencia ni autorización humana"
    blocks:
      - {type: image, asset: fumigation-flow-1, h: 78}
      - {type: image, asset: fumigation-flow-2, h: 78}
      - type: cards
        cols: 4
        compact: true
        items:
          - {icon: x-circle, title: "La orden no sale", text: "Sin polígono del lote o sin registro de vuelo cerrado"}
          - {icon: clock, title: "Fumigación abierta", text: "Hasta persistir el objeto de verificación"}
          - {icon: shield-check, title: "Autorización humana", text: "Ningún disparador la ejecuta"}
          - {icon: location, title: "Cae el enlace", text: "La misión ya está cargada; el registro se publica al volver"}
    source: "Servicio de drones · complete/architecture.svg, flujo de plaga a fumigación"
    presenter: "JR1"
    time: "1:15"
    notes: |
      Este es el camino de la alerta al caso cerrado, en ocho pasos persistidos, tomado del diagrama completo. Cuatro compuertas lo protegen.
      La orden no puede salir sin el polígono del lote y un registro de vuelo cerrado. Una fumigación sigue abierta hasta que llega el objeto de verificación. La autorización es humana y ningún disparador puede ejecutarla. Y si el enlace cae sobre el lote, la misión ya está cargada y el registro se publica cuando vuelve el enlace.
      El estado no cambia hasta que ese registro se persiste. El detalle está en el documento del servicio de drones.

  # Slide 11
  - kind: content
    part: 3
    number: 11
    eyebrow: "Parte 3 · Modo de vuelo y cargas · JR1"
    title: "Cuatro funciones, una por disparador, sin cómputo esperando"
    blocks:
      - type: split
        ratio: 0.5
        left:
          - {type: image, asset: inference}
        right:
          - type: bullets
            items:
              - "**Disparadores:** lote de telemetría, confirmación de foco, verificación y estimación de cosecha"
              - "**Módulo inference-functions (B10, D10):** cola SQS con DLQ, rol IAM mínimo y Lambda que llama a Amazon Nova Pro en Bedrock"
              - "**Cada resultado** guarda hora, confianza y origen; cero EC2 y cero concurrencia aprovisionada"
              - "**Todo en us-east-1;** al modelo solo llegan imágenes filtradas y lecturas que abren alerta"
          - type: callout
            h: 74
            text: "Un orquestador de capacidades del dron, dirigido por eventos, coordina las funciones: bus y reglas de EventBridge y una cola SQS por función (ADR-004, propuesto)."
    source: "Funciones de inferencia · ADR-004 · aroma-pacifico-terraform-modules PR #14 · flows/inference-functions.svg"
    presenter: "JR1"
    time: "1:00"
    notes: |
      La inferencia es dirigida por eventos. Cuatro funciones, una por disparador: el lote de telemetría, la confirmación del foco, el objeto de verificación y la estimación de cosecha.
      Las coordina un orquestador de capacidades del dron dirigido por eventos: un bus de EventBridge con reglas y una cola SQS por función. Esa decisión es el ADR-004, fusionado con estado propuesto, y el orquestador ya aparece rotulado en el diagrama completo y en el de funciones de inferencia.
      El módulo de funciones de inferencia implementa el patrón: una cola SQS de disparo, una cola de mensajes fallidos, un rol IAM de mínimo privilegio y una función Lambda que llama a Amazon Nova Pro en Bedrock. Cada función lee un objeto persistido, llama a la inferencia administrada en us-east-1 y persiste el resultado con hora, confianza y objeto de origen.
      No entrenamos modelos y ningún cómputo espera objetos: cero EC2, cero contenedores, cero concurrencia aprovisionada. Si una invocación falla, el objeto de origen se queda y el estado del caso no cambia. Todo se guarda y procesa en us-east-1, y al modelo solo llegan imágenes de cultivo filtradas y lecturas que abren una alerta.

