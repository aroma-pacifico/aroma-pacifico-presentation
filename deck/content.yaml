    - Por día
    - Pico
    - Horizonte
    widths:
    - 3.0
    - 1.6
    - 1.8
    - 2.6
    align: lrrr
    rows:
    - - Lecturas de cultivo, 200 fincas × 6
      - '1.200'
      - 50 por hora
      - 438.000 al año
    - - Lecturas de secado en cosecha, 100 fincas × 24
      - '2.400'
      - 100 por hora
      - 108.000 en un mes de cosecha
    - - Posiciones de 60 transportadores, cada 5 min
      - '7.200'
      - 12 por hora cada uno
      - 13,1 millones en 5 años
    - - Sacos recibidos, 3 centros × 400
      - '1.200'
      - 400 por centro
      - 2,19 millones en 5 años
    - - Consultas del saco en cosecha
      - '-'
