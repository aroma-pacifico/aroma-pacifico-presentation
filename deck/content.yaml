    - title: Aprobación
      text: Otra persona de PDN_APPROVERS aprueba esa huella
    - title: Ventana
      text: Rechaza 05:00 a 18:00 en semana de cosecha, salvo incidente
    - title: Aplicar
      text: Solo el plan aprobado, stack por stack, con registro
  - type: cards
    cols: 3
    compact: true
    items:
    - icon: clock
      title: Volver atrás
      text: Revert por pull request y nueva promoción; el plan muestra el cambio inverso
    - icon: alert-triangle
      title: Bajar un ambiente
      text: Orden inverso de stacks; el aprobador lee primero las destrucciones
    - icon: shield-check
      title: Datos protegidos
      text: prevent_destroy en las tablas y estado recuperable del bucket versionado
  notes: 'Subir la infraestructura sigue la promoción dev, qa y pdn. Para producción se publica el plan, el delta de costo y la huella del plan, y otra persona de la lista de aprobadores aprueba exactamente esa huella. El pipeline rechaza la ventana de cosecha salvo un incidente y solo aplica el plan aprobado. Volver atrás es un revert y una nueva promoción; bajar un ambiente va en orden inverso y las tablas con datos tienen prevent_destroy.

    '
